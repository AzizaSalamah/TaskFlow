<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TaskFlow</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        h1 {
            color: #365B43;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">TaskFlow</a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="signup.html" class="signup-btn">Sign Up</a></li>
        </ul>
    </nav>
</header>

<main class="auth-section">

    <section class="auth-intro">

        <h1>Welcome Back!</h1>

        <p>
            Stay organized, manage your projects,
            and achieve more with TaskFlow.
        </p>

        <!-- Click the image to visit About Us -->
        <div class="auth-image">
            <img src="images/taskflow.png"
                 alt="TaskFlow Illustration"
                 usemap="#taskflowMap">

            <map name="taskflowMap">
                <area shape="rect"
                      coords="0,0,1536,1024"
                      href="about.html"
                      alt="about us">
            </map>
        </div>

    </section>

    <section class="auth-card">

        <h2>Login to TaskFlow</h2>
        <p>Enter your account details to continue.</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   placeholder="Enter your password" required>

            <p id="loginMessage" class="auth-message"></p>

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

    </section>

</main>

<footer>
    <p>© 2026 TaskFlow. All Rights Reserved.</p>
    <a href="about.html">Learn More About Us</a>
</footer>

<script src="js/auth.js"></script>

</body>
</html>
